name: "Tesbuild"
on:
  pull_request:
  push:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v27
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - run: nix-build -E 'with import <nixpkgs> { overlays = [ (import ./redot-overlay.nix) ]; }; pkgs.redot' --keep-failed
